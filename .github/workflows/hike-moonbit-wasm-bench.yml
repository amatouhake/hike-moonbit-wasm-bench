name: Hike vs MoonBit Wasm size benchmark

on:
  push:
    branches:
      - main
    paths:
      - "bench.env"
      - "hike/**"
      - "host/**"
      - "moonbit/**"
      - "scripts/**"
      - ".github/workflows/hike-moonbit-wasm-bench.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bench-results]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binaryen brotli

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Run benchmark
        run: bash scripts/benchmark.sh

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hike-moonbit-wasm-bench-${{ github.run_id }}
          if-no-files-found: error
          path: |
            out/
            results/latest.md
            results/latest.csv
          retention-days: 30

      - name: Publish generated result tables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.md results/latest.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "chore: update wasm benchmark results [bench-results]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
